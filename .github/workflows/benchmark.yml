name: Benchmark

on:
  pull_request:

jobs:
  benchmark:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: stable
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      # 1. Checkout Main and Benchmark
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main_ref
          fetch-depth: 1

      - name: Benchmark Main
        run: |
          # Copy PR's benchmark harness to main_ref to enable comparative measurement
          # This ensures we measure 'main' code with the 'new' benchmark logic (AOT mode, categories)
          cp benchmark/bench_compare.dart main_ref/benchmark/bench_compare.dart
          cp scripts/benchmark_runner.py main_ref/scripts/benchmark_runner.py

          cd main_ref
          dart pub get
          uv run scripts/benchmark_runner.py benchmark/bench_compare.dart --mode aot --save ../main_bench.json
        continue-on-error: true

      # 2. Benchmark Current PR (Root)
      - name: Benchmark PR
        run: |
          dart pub get
          uv run scripts/benchmark_runner.py benchmark/bench_compare.dart --mode aot --save pr_bench.json

      # 3. Compare Results
      - name: Compare Results
        run: |
          if [ -f "main_bench.json" ] && [ -f "pr_bench.json" ]; then
            uv run scripts/benchmark_runner.py --compare main_bench.json pr_bench.json --mode aot
          else
            echo "Skipping comparison (missing base/target json)"
            # Fallback: Just use summary
            cp benchmark_summary.md benchmark_comparison.md
          fi

      # 4. The effort trade-off, both sides of it
      #
      # The comparison above measures one effort level, so it cannot tell
      # "this got slower" apart from "this now decodes, and decoding it costs a
      # full retry ladder" - and it cannot see a change that buys speed by
      # giving up detection at all. Reporting detection and latency across
      # every level makes which of the two it is obvious, and keeps the numbers
      # documented on DecodeEffort from going stale.
      #
      # Detection is compared against main because a drop there is a
      # regression. Latency per level is PR-only: it explains the PR's own
      # numbers rather than tracking a baseline, which the job above already
      # does.
      - name: Detection rate (PR)
        run: |
          dart run benchmark/tool_detection_rate.dart --matrix > detection_pr.md

      - name: Detection rate (main)
        run: |
          cp benchmark/tool_detection_rate.dart main_ref/benchmark/tool_detection_rate.dart
          cd main_ref
          dart run benchmark/tool_detection_rate.dart --matrix > ../detection_main.md
        continue-on-error: true

      - name: Latency by effort (PR)
        run: |
          dart compile exe benchmark/tool_bench_seq.dart -o /tmp/bench_seq
          /tmp/bench_seq --matrix > latency_pr.md
        continue-on-error: true

      - name: Append effort report
        run: |
          {
            echo ''
            echo '## Effort trade-off'
            echo ''
            echo '**This PR**'
            echo ''
            cat detection_pr.md
            if [ -f latency_pr.md ]; then
              echo ''
              cat latency_pr.md
            fi
            if [ -f detection_main.md ]; then
              echo ''
              echo '**main, for comparison**'
              echo ''
              cat detection_main.md
            fi
          } >> benchmark_comparison.md

      - run: cat benchmark_comparison.md >> $GITHUB_STEP_SUMMARY

      - name: Post to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            try {
              const file = fs.existsSync('benchmark_comparison.md') ? 'benchmark_comparison.md' : 'benchmark_summary.md';
              const report = fs.readFileSync(file, 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
            } catch (error) {
              console.log('No benchmark report found');
            }
